<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scripture Output</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
			}
			#wrap {
				width: 85%;
				text-align: center;
				opacity: 0;
				transform: translateY(10px);
				transition:
					opacity 0.5s ease,
					transform 0.5s ease;
			}
			#wrap.visible {
				opacity: 1;
				transform: translateY(0);
			}
			#wrap.hidden {
				opacity: 0;
				pointer-events: none;
			}
			@font-face {
				font-family: "ChurchSerif";
				src: url("/fonts/ChurchSerif-Bold.ttf") format("truetype");
				font-weight: bold;
				font-style: normal;
			}
			@font-face {
				font-family: "ChurchSerif";
				src: url("/fonts/ChurchSerif-Regular.ttf") format("truetype");
				font-weight: normal;
				font-style: normal;
			}
			#verse {
				font-family: "ChurchSerif", "Book Antiqua", "Palatino Linotype", "Georgia", "Liberation Serif", "Noto Serif", "Times New Roman", serif;
				font-size: clamp(22px, min(3.5vw, 5.2vh), 60px);
				font-weight: bold;
				color: white;
				line-height: 1.38;
				text-shadow:
					0 3px 16px rgba(0, 0, 0, 0.9),
					0 0 6px rgba(0, 0, 0, 0.7),
					0 0 2px rgba(0, 0, 0, 0.8);
				word-break: normal;
				overflow-wrap: break-word;
			}
			#ref {
				margin-top: clamp(12px, 1.4vw, 24px);
				font-family: "ChurchSerif", "Book Antiqua", "Palatino Linotype", "Georgia", "Liberation Serif", "Noto Serif", "Times New Roman", serif;
				font-size: clamp(18px, min(2.5vw, 3.8vh), 42px);
				font-weight: bold;
				color: #e8d9a0;
				text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
				word-break: normal;
				overflow-wrap: break-word;
			}
		</style>
	</head>
	<body>
		<div id="wrap" class="hidden">
			<div id="verse"></div>
			<div id="ref"></div>
		</div>

		<script>
			const wrap = document.getElementById("wrap");
			const verseEl = document.getElementById("verse");
			const refEl = document.getElementById("ref");

			let ws = null;
			let reconnectTimer = null;

			function getWsUrl() {
				const protocol = location.protocol === "https:" ? "wss:" : "ws:";
				return `${protocol}//${location.host}/ws`;
			}

			function ensureFits() {
				// Reset to CSS-computed base size (from clamp)
				verseEl.style.fontSize = "";
				refEl.style.fontSize = "";
				refEl.style.marginTop = "";

				const maxH = window.innerHeight * 0.88;
				const maxW = window.innerWidth * 0.88;

				// Binary-search for the largest font size that still fits —
				// just like EasyWorship: always maximum size, never overflow, never hidden.
				const baseSize = parseFloat(window.getComputedStyle(verseEl).fontSize) || 36;

				let lo = 10;
				let hi = Math.max(baseSize, 120); // search ceiling

				// Expand hi if base already fits — so we can grow text too
				verseEl.style.fontSize = hi + "px";
				refEl.style.fontSize = Math.floor(hi * 0.7) + "px";
				refEl.style.marginTop = Math.floor(hi * 0.3) + "px";
				while (wrap.scrollHeight <= maxH && wrap.scrollWidth <= maxW && hi < 300) {
					hi *= 1.5;
					verseEl.style.fontSize = hi + "px";
					refEl.style.fontSize = Math.floor(hi * 0.7) + "px";
					refEl.style.marginTop = Math.floor(hi * 0.3) + "px";
				}

				// Binary search between lo and hi
				let best = lo;
				for (let iter = 0; iter < 20; iter++) {
					const mid = Math.floor((lo + hi) / 2);
					if (mid === lo) break;
					verseEl.style.fontSize = mid + "px";
					refEl.style.fontSize = Math.floor(mid * 0.7) + "px";
					refEl.style.marginTop = Math.floor(mid * 0.3) + "px";
					if (wrap.scrollHeight <= maxH && wrap.scrollWidth <= maxW) {
						best = mid;
						lo = mid;
					} else {
						hi = mid;
					}
				}

				verseEl.style.fontSize = best + "px";
				refEl.style.fontSize = Math.floor(best * 0.7) + "px";
				refEl.style.marginTop = Math.floor(best * 0.3) + "px";
			}

			let resizeRaf = null;
			window.addEventListener("resize", () => {
				if (resizeRaf) cancelAnimationFrame(resizeRaf);
				resizeRaf = requestAnimationFrame(() => {
					ensureFits();
				});
			});

			function connect() {
				if (
					ws &&
					(ws.readyState === WebSocket.OPEN ||
						ws.readyState === WebSocket.CONNECTING)
				) {
					return;
				}
				clearTimeout(reconnectTimer);

				try {
					ws = new WebSocket(getWsUrl());
				} catch (_) {
					scheduleReconnect();
					return;
				}

				const isNdi = location.search.includes("ndi=1");
				if (isNdi) {
					wrap.style.transition = "none";
				}

				ws.onmessage = (e) => {
					try {
						const data = JSON.parse(e.data);
						if (data.channel !== "scripture") return;

						const verSuffix = data.version ? ` (${String(data.version).toUpperCase()})` : "";
						const refText = `${data.book} ${data.chapter}:${data.verse}${verSuffix}`;

						if (isNdi) {
							if (data.type === "clear") {
								wrap.classList.remove("visible");
								wrap.classList.add("hidden");
								if (typeof window.onNdiReady === "function") {
									window.onNdiReady("clear");
								}
								return;
							}
							verseEl.textContent = data.text;
							refEl.textContent = refText;
							ensureFits();
							wrap.classList.remove("hidden");
							wrap.classList.add("visible");
							if (typeof window.onNdiReady === "function") {
								window.onNdiReady("rendered");
							}
							return;
						}

						if (data.type === "clear") {
							wrap.classList.remove("visible");
							wrap.classList.add("hidden");
							return;
						}
						wrap.classList.remove("visible");
						wrap.classList.add("hidden");
						setTimeout(() => {
							verseEl.textContent = data.text;
							refEl.textContent = refText;
							ensureFits();
							wrap.classList.remove("hidden");
							wrap.classList.add("visible");
						}, 200);
					} catch (_) {}
				};

				ws.onclose = () => {
					scheduleReconnect();
				};

				ws.onerror = () => {
					try {
						ws.close();
					} catch (_) {}
				};
			}

			function scheduleReconnect() {
				clearTimeout(reconnectTimer);
				reconnectTimer = setTimeout(connect, 1000);
			}

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (
						!ws ||
						ws.readyState === WebSocket.CLOSED ||
						ws.readyState === WebSocket.CLOSING
					) {
						connect();
					}
				}
			});

			window.addEventListener("focus", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connect();
				}
			});

			window.addEventListener("pageshow", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connect();
				}
			});

			connect();
		</script>
	</body>
</html>
